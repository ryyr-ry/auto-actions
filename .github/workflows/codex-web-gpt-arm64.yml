name: Build Codex Web GPT ARM64

on:
  push:
    branches:
      - codex-web-gpt-arm64-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-11-arm
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Clone pinned upstream source
        shell: pwsh
        run: |
          git clone --depth 1 --branch v6.1.12 https://github.com/miuuyy/codex-chatgpt-web.git upstream
          if ($LASTEXITCODE -ne 0) { throw "Upstream clone failed" }
      - name: Apply Windows ARM64 fixes
        shell: pwsh
        run: |
          ./codex-web-gpt-arm64/patch.ps1 -RepositoryRoot ./upstream
          git -C upstream diff --check
          if ($LASTEXITCODE -ne 0) { throw "Whitespace verification failed" }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Verify native tools
        shell: pwsh
        run: |
          if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne [Runtime.InteropServices.Architecture]::Arm64) { throw "ARM64 OS required" }
          if ((node -p 'process.arch').Trim() -ne 'arm64') { throw "ARM64 Node required" }
          if ((bun -e 'console.log(process.arch)').Trim() -ne 'arm64') { throw "ARM64 Bun required" }
      - name: Install pinned dependencies
        shell: pwsh
        working-directory: upstream
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw "Bun root install failed" }
          Push-Location launcher
          try {
            bun install --frozen-lockfile
            if ($LASTEXITCODE -ne 0) { throw "Launcher install failed" }
          } finally { Pop-Location }
      - name: Prepare verified ARM64 Bun
        shell: pwsh
        working-directory: upstream
        run: |
          ./scripts/prepare-windows-baseline-bun.ps1 -Version 1.4.0 -GitHubEnv $env:GITHUB_ENV -Architecture arm64
          if ($LASTEXITCODE -ne 0) { throw "Native Bun preparation failed" }
      - name: Update vulnerable Vite dev dependency
        shell: pwsh
        working-directory: upstream/launcher
        run: |
          bun update vite@6.4.4
          if ($LASTEXITCODE -ne 0) { throw "Vite security update failed" }
      - name: Upgrade electron-builder to ARM64 NSIS fixed release
        shell: pwsh
        working-directory: upstream/launcher
        run: |
          bun add --dev --exact electron-builder@26.15.6
          if ($LASTEXITCODE -ne 0) { throw "ARM64-safe electron-builder update failed" }
          $reported = (bun -e 'console.log(require("electron-builder/package.json").version)').Trim()
          if ($reported -ne "26.15.6") { throw "Unexpected electron-builder version: $reported" }
      - name: Validate project
        shell: pwsh
        working-directory: upstream
        run: |
          bun run typecheck
          if ($LASTEXITCODE -ne 0) { throw "Root typecheck failed" }
          bun run launcher:typecheck
          if ($LASTEXITCODE -ne 0) { throw "Launcher typecheck failed" }
          bun test tests/tunnel.test.ts
          if ($LASTEXITCODE -ne 0) { throw "Tunnel tests failed" }
          bun audit
          if ($LASTEXITCODE -ne 0) { throw "Root audit failed" }
          bun run launcher:audit
          if ($LASTEXITCODE -ne 0) { throw "Launcher audit failed" }
      - name: Exercise real OpenAI ARM64 tunnel installation
        shell: pwsh
        working-directory: upstream
        timeout-minutes: 6
        run: |
          $env:CODEX_CHATGPT_WEB_HOME = Join-Path $env:RUNNER_TEMP "codex-arm64-tunnel-integration"
          bun -e 'import { installTunnelClient } from "./src/tunnel.ts"; const first = await installTunnelClient(); if (!first.endsWith("tunnel-client-arm64.exe")) throw new Error("Wrong architecture tunnel"); const second = await installTunnelClient(); if (first !== second) throw new Error("Tunnel reuse failed"); console.log("ARM64_TUNNEL_INSTALL_AND_REUSE_OK");'
          if ($LASTEXITCODE -ne 0) { throw "Native ARM64 tunnel installation failed" }
      - name: Package ARM64 installer
        shell: pwsh
        working-directory: upstream
        run: |
          $env:ELECTRON_BUILDER_7Z_FILTER = "BCJ"
          bun run app:package
          if ($LASTEXITCODE -ne 0) { throw "Packaging failed" }
          $installer = "launcher/artifacts/codex-web-gpt-6.1.12-win-arm64.exe"
          if (!(Test-Path $installer)) { throw "ARM64 EXE not found" }
          Get-FileHash -Algorithm SHA256 $installer | Format-List
      - name: Prepare previous user data and probe x64 installer compatibility
        shell: pwsh
        working-directory: upstream
        timeout-minutes: 10
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "codex-web-gpt-6.1.12-win-x64.exe"
          $release = "https://github.com/miuuyy/codex-chatgpt-web/releases/download/v6.1.12"
          Invoke-WebRequest "$release/checksums.txt" -OutFile (Join-Path $env:RUNNER_TEMP "checksums.txt")
          $name = [IO.Path]::GetFileName($installer)
          $match = Get-Content (Join-Path $env:RUNNER_TEMP "checksums.txt") | Where-Object { $_ -match "^[a-fA-F0-9]{64}  $([regex]::Escape($name))$" }
          if (@($match).Count -ne 1) { throw "Official x64 installer checksum is not available" }
          Invoke-WebRequest "$release/$name" -OutFile $installer
          $expected = $match.Substring(0, 64).ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Official x64 installer checksum mismatch" }
          & $installer "/S" "/currentuser"
          if ($LASTEXITCODE -ne 0) { Write-Warning "Original x64 installer could not run on the hosted ARM64 runner (exit $LASTEXITCODE); x64-to-ARM64 in-place install is NOT verified in this environment." }
          $data = Join-Path $env:APPDATA "Codex Web GPT"
          $core = Join-Path $env:USERPROFILE ".codex-chatgpt-web"
          $codex = Join-Path $env:USERPROFILE ".codex"
          foreach ($dir in @($data, $core, $codex)) {
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Set-Content -LiteralPath (Join-Path $dir "arm64-migration-sentinel.txt") -Value "keep-existing-user-data" -NoNewline
          }
      - name: Smoke-test the installed ARM64 application
        shell: pwsh
        working-directory: upstream
        timeout-minutes: 8
        run: |
          bun run app:smoke
          if ($LASTEXITCODE -ne 0) { throw "Packaged ARM64 application could not launch correctly" }
      - name: Confirm ARM64 installation preserves preexisting user directories
        shell: pwsh
        run: |
          foreach ($dir in @((Join-Path $env:APPDATA "Codex Web GPT"), (Join-Path $env:USERPROFILE ".codex-chatgpt-web"), (Join-Path $env:USERPROFILE ".codex"))) {
            $marker = Join-Path $dir "arm64-migration-sentinel.txt"
            if (!(Test-Path $marker)) { throw "Migration removed a user-data marker: $dir" }
            if ((Get-Content -Raw $marker) -ne "keep-existing-user-data") { throw "Migration changed a user-data marker: $dir" }
          }
      - name: Diagnose packaged installer failure (CI-only)
        if: failure()
        shell: pwsh
        run: |
          Write-Host "Registry install metadata:"
          reg query "HKCU\Software\d1a6026a-6210-588e-9a2b-da3936f94e02" /s
          Write-Host "Programs directory names:"
          $programs = Join-Path $env:LOCALAPPDATA "Programs"
          if (Test-Path $programs) {
            Get-ChildItem $programs -Force | Select-Object Name, FullName
            Get-ChildItem $programs -Filter "*Codex*" -Directory -ErrorAction SilentlyContinue |
              ForEach-Object { Get-ChildItem $_.FullName -Force | Select-Object Name, Length }
          }
          Write-Host "Defender detections (runner only):"
          try { Get-MpThreatDetection | Select-Object ThreatID, InitialDetectionTime, Resources | Format-List } catch { Write-Host "No Defender data available" }
          Write-Host "Installed application executables:"
          Get-ChildItem $programs -Filter "Codex Web GPT.exe" -Recurse -ErrorAction SilentlyContinue |
            Select-Object FullName, Length
      - name: Upload ARM64 installer
        uses: actions/upload-artifact@v4
        with:
          name: codex-web-gpt-6.1.12-windows-arm64
          if-no-files-found: error
          path: upstream/launcher/artifacts/codex-web-gpt-6.1.12-win-arm64.exe
